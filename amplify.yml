version: 1
backend:
  phases:
    build:
      commands:
        - yarn install
        - npx amplify sandbox --profile AmplifyUser --once
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18.19.0
        - nvm use 18.19.0
        - yarn install
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
      - .yarn/cache/**/*
